name: Build Android app

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - arena/01a039ca-cgpacalculator
    paths:
      - 'gpa_calculator/**'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build APK and AAB
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gpa_calculator

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android build scaffold
        run: |
          cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml
          flutter create --platforms=android .
          cp /tmp/AndroidManifest.xml android/app/src/main/AndroidManifest.xml

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze source
        run: flutter analyze

      - name: Build release APK
        run: flutter build apk --release

      - name: Build release app bundle
        run: flutter build appbundle --release

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: gpa-calculator-apk
          path: gpa_calculator/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: gpa-calculator-aab
          path: gpa_calculator/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
